[workspace]
resolver = "2"
members = [
    "crates/proto",
    "crates/core",
    "crates/vss",
    "crates/share",
    "crates/holder",
    "crates/admin",
    "crates/server",
    "crates/loadtest",
    "desktop/src-tauri",
]
default-members = [
    "crates/proto",
    "crates/core",
    "crates/vss",
    "crates/share",
    "crates/holder",
    "crates/admin",
    "crates/server",
    "crates/loadtest",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"

[workspace.dependencies]
argon2 = "0.5"
async-trait = "0.1"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
curve25519-dalek = { version = "4", features = ["zeroize"] }
ed25519-dalek = { version = "2", features = ["zeroize"] }
hex = "0.4"
hkdf = "0.12"
k256 = { version = "0.13", features = ["ecdsa"] }
prost = "0.14"
prost-types = "0.14"
protoc-bin-vendored = "3"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "sqlite",
    "uuid",
    "time",
    "json",
    "migrate",
    "macros",
] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
toml = "0.8"
tracing = { version = "0.1", features = ["attributes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
uuid = { version = "1", features = ["v4"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
x509-parser = "0.18"
zeroize = "1"
