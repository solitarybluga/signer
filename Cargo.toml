[package]
name = "signer"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
chacha20poly1305 = "0.10"
prost = "0.14"
prost-types = "0.14"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sharks = "0.5"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "sqlite",
    "uuid",
    "time",
    "json",
    "migrate",
    "macros",
] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tonic = "0.14"
tonic-prost = "0.14"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"
