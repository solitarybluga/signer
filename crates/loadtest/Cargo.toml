[package]
name = "signer-loadtest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Load-test helper for signer unsealing and signing"

[[bin]]
name = "signer-loadtest"
path = "src/main.rs"

[dependencies]
clap.workspace = true
signer-holder = { path = "../holder" }
signer-pki = { path = "../pki" }
signer-proto = { path = "../proto" }
signer-share = { path = "../share" }
tokio.workspace = true
tonic = { workspace = true, features = ["tls-ring"] }
zeroize.workspace = true
